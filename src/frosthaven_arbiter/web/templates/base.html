<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Frosthaven Arbiter</title>
    <link rel="stylesheet" href="/static/arbiter.css" />
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <header>
        <h1>Frosthaven Arbiter</h1>
        <nav>
            <a href="/profile" hx-get="/profile" hx-target="#main" hx-push-url="true">Profile</a>
        </nav>
    </header>
    <main id="main">
        <section id="conversations">
            <h2>Conversations</h2>
            <ul>
                {% for conversation in conversations %}
                <li>
                    <a href="/conversations/{{ conversation.id }}"
                       hx-get="/conversations/{{ conversation.id }}"
                       hx-target="#main"
                       hx-push-url="true">
                        {{ conversation.title or ("Conversation " ~ conversation.id) }}
                    </a>
                </li>
                {% endfor %}
            </ul>
            <button hx-post="/conversations" hx-target="#main">New conversation</button>
        </section>
    </main>
</body>
</html>
