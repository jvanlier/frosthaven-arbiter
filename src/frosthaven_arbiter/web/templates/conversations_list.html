<section id="conversations">
    <h2>Conversations</h2>
    <ul>
        {% for conversation in conversations %}
        <li>
            <a href="/conversations/{{ conversation.id }}"
               hx-get="/conversations/{{ conversation.id }}"
               hx-target="#main"
               hx-push-url="true">
                {{ conversation.title or ("Conversation " ~ conversation.id) }}
            </a>
        </li>
        {% endfor %}
    </ul>
    <button hx-post="/conversations" hx-target="#main">New conversation</button>
</section>
