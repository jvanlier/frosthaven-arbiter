<div id="conversation">
    <a class="button" href="/" hx-get="/" hx-target="#main" hx-push-url="true" style="margin-top: 0; margin-bottom: 1rem;">← Back</a>
    <h2 id="conversation-title">{{ conversation.title or ("Conversation " ~ conversation.id) }}</h2>
    <div id="messages">
        {% for message in conversation.messages %}
        {% include "_message.html" %}
        {% endfor %}
    </div>
    <form
        class="question-form"
        method="post"
        action="/conversations/{{ conversation.id }}/questions"
        data-stream-url="/conversations/{{ conversation.id }}/questions/stream"
        data-conversation-id="{{ conversation.id }}">
        {% if not conversation.messages %}
        <label for="question">Ask a rules question</label>
        <textarea id="question" name="question" required></textarea>
        {% else %}
        <textarea id="question" name="question" placeholder="Continue the conversation…" required></textarea>
        {% endif %}
        <button type="submit">Ask the Arbiter</button>
    </form>
    <div class="loading-overlay" hidden>
        <div class="loading-card">
            <div class="spinner" aria-hidden="true"></div>
            <p class="loading-status" role="status" aria-live="polite">Searching the rulebook and FAQ</p>
        </div>
    </div>
    <button hx-delete="/conversations/{{ conversation.id }}" hx-target="#messages" hx-swap="innerHTML">
        Clear conversation
    </button>
    <button
        class="button-danger"
        hx-delete="/conversations/{{ conversation.id }}/full"
        hx-target="#main"
        hx-swap="innerHTML"
        hx-confirm="Delete this conversation? This cannot be undone.">
        Delete conversation
    </button>
</div>
