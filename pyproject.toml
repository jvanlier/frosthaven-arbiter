[project]
name = "frosthaven-arbiter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jori", email = "jori@nomail" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.51.0",
]

[project.scripts]
frosthaven-arbiter = "frosthaven_arbiter:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.56.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "pytest-playwright>=0.7.1",
    "pyright>=1.1.400",
    "ruff>=0.15.22",
    "djlint>=1.42.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "ARG", "A"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: browser-driven tests requiring Playwright; opt-in, excluded by default (run with `-m e2e`)",
]
addopts = "-m 'not e2e' --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80

[tool.djlint]
profile = "jinja"
indent = 4
max_line_length = 200
max_attribute_length = 200
ignore = "H021,H023,H030,H031,J004,J018"
ignore_blocks = [
    "for",
    "if",
    "else",
    "endif",
    "endfor",
]
